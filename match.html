<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marathi Alphabet Match Pairs</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
</head>
<body class="match-page">
    <div class="app-container">
        <nav class="top-tabs">
            <a href="alphabet.html" class="tab-link">Alphabets</a>
            <a href="index.html" class="tab-link">Tracing</a>
            <a href="match.html" class="tab-link active">Match pairs</a>
        </nav>
        <header>
            <h1 class="page-title">Match Pairs</h1>
        </header>
        
        <main class="match-game-container">
            <canvas id="match-canvas"></canvas>
            
            <div class="match-content">
                <div class="match-column" id="letters-column">
                    <!-- Letter cards injected here -->
                </div>
                <div class="match-column" id="pictures-column">
                    <!-- Picture cards injected here -->
                </div>
            </div>
            
            <div id="feedback-message" class="hidden"></div>
            <div id="success-message" class="hidden">Great Job! 🎉</div>
        </main>
    </div>
    
    <script src="data.js"></script>
    <script src="match.js"></script>
</body>
</html>
